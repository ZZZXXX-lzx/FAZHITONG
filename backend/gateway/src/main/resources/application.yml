server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/user/**
        - id: document-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/document/**
        - id: consultation-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/consultation/**
        - id: contract-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/contract/**
        - id: case-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/case/**
        - id: payment-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/payment/**
      default-filters:
        - StripPrefix=1
  codec:
    max-in-memory-size: 10MB

gateway:
  cors:
    allowed-origins: "*"

logging:
  level:
    com.fabaotong: DEBUG
